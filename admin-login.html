<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>System Administrator Login | UniCare</title>

    <link rel="stylesheet" href="CSS/style.css">
    <link rel="stylesheet" href="CSS/student_login.css">
    <link rel="stylesheet" href="CSS/staff_login.css">
</head>

<body>

    <header class="navbar">
        <div class="logo">
            <img src="assets/Images/aiub-logo.png" alt="UniCare Logo">
            <span>UniCare</span>
        </div>

        <nav>
            <a href="index.html">Home</a>
            <a href="admin-login.html">System Administrator Login</a>
        </nav>
    </header>

    <section class="auth-section">
        <div class="auth-card">

            <span class="role-badge admin">Authorized Staff Only</span>

            <h1>System Administrator Login</h1>
            <p>Sign in to access your System Administrator dashboard</p>

            <form id="loginForm" novalidate>

                <div class="form-group">
                    <label for="userId">Admin ID</label>
                    <input type="text" id="userId" placeholder="e.g. ADM-001" autocomplete="username">
                    <small id="userIdError"></small>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="Enter your password" autocomplete="current-password">
                    <small id="passwordError"></small>
                </div>

                <button type="submit" class="auth-btn">Login</button>

                <p id="formMessage"></p>
            </form>

            <p class="notice">Administrator accounts are created during initial system setup. Public registration is not available.<br><br><b>Demo login:</b> ADM-001 / Admin@123</p>

            <p class="back-link"><a href="index.html">Back to Home</a></p>
        </div>
    </section>

    <script src="javascript/auth_data.js"></script>
    <script src="javascript/AL_validation.js"></script>
</body>

</html>
