<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | UniCare</title>
    <link rel="stylesheet" href="CSS/style.css">
</head>
<body>
    <!-- PLACEHOLDER: the Admin dashboard (user management, creating officer accounts,
         monitoring all complaints) belongs to the Admin team member (part 4). -->
    <header class="navbar">
        <div class="logo"><img src="assets/Images/aiub-logo.png" alt="UniCare Logo"><span>UniCare</span></div>
        <button class="login-btn" id="logoutBtn">Logout</button>
    </header>
    <section class="about">
        <h2>Admin Dashboard</h2>
        <p id="welcome"></p>
        <p>This page is a placeholder. The full Admin dashboard will replace it.</p>
    </section>
    <script>
        const admin = JSON.parse(sessionStorage.getItem("unicare_admin") || "null");
        if (!admin) window.location.href = "admin-login.html";
        else document.getElementById("welcome").textContent = "Welcome, " + admin.name + ".";
        document.getElementById("logoutBtn").onclick = function () {
            sessionStorage.removeItem("unicare_admin");
            window.location.href = "admin-login.html";
        };
    </script>
</body>
</html>
