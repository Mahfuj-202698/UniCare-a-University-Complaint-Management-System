<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Complaint Officer Dashboard | UniCare</title>

    <link rel="stylesheet" href="CSS/style.css">
    <link rel="stylesheet" href="CSS/officer_dashboard.css">
</head>

<body>

    <header class="navbar">
        <div class="logo">
            <img src="assets/Images/aiub-logo.png" alt="UniCare Logo">
            <span>UniCare</span>
        </div>

        <div class="officer-info">
            <span id="officerName"></span>
            <button id="logoutBtn" class="logout-btn">Logout</button>
        </div>
    </header>

    <main class="dashboard">

        <h1>Complaint Officer Dashboard</h1>

        <!-- Summary Cards -->
        <section class="stats">
            <div class="stat-card"><h3 id="statTotal">0</h3><p>Total</p></div>
            <div class="stat-card pending"><h3 id="statPending">0</h3><p>Pending</p></div>
            <div class="stat-card progress"><h3 id="statProgress">0</h3><p>In Progress</p></div>
            <div class="stat-card resolved"><h3 id="statResolved">0</h3><p>Resolved</p></div>
        </section>

        <!-- Filters -->
        <section class="filters">
            <input type="text" id="searchBox" placeholder="Search by ID, title or student name">

            <select id="statusFilter">
                <option value="">All Statuses</option>
                <option>Pending</option>
                <option>In Progress</option>
                <option>Resolved</option>
                <option>Rejected</option>
            </select>

            <select id="priorityFilter">
                <option value="">All Priorities</option>
                <option>High</option>
                <option>Medium</option>
                <option>Low</option>
            </select>
        </section>

        <!-- Complaints Table -->
        <section class="table-wrap">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Title</th>
                        <th>Student</th>
                        <th>Department</th>
                        <th>Priority</th>
                        <th>Status</th>
                        <th>Date</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="complaintBody"></tbody>
            </table>
            <p id="emptyMsg" class="empty">No complaints found.</p>
        </section>

    </main>

    <!-- Manage Complaint Modal -->
    <div class="modal" id="modal">
        <div class="modal-box">
            <button class="close-btn" id="closeModal" aria-label="Close">&times;</button>

            <h2 id="mTitle"></h2>
            <p class="meta" id="mMeta"></p>
            <p id="mDesc" class="desc"></p>

            <h3>Previous Responses</h3>
            <div id="mHistory" class="history"></div>

            <form id="updateForm" novalidate>
                <div class="form-group">
                    <label for="mStatus">Update Status</label>
                    <select id="mStatus">
                        <option>Pending</option>
                        <option>In Progress</option>
                        <option>Resolved</option>
                        <option>Rejected</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="mPriority">Priority</label>
                    <select id="mPriority">
                        <option>High</option>
                        <option>Medium</option>
                        <option>Low</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="mResponse">Response to Student</label>
                    <textarea id="mResponse" rows="4" placeholder="Write your response..."></textarea>
                    <small id="mResponseError"></small>
                </div>

                <button type="submit" class="save-btn">Save Update</button>
                <p id="mMessage"></p>
            </form>
        </div>
    </div>

    <script src="javascript/auth_data.js"></script>
    <script src="javascript/officer_dashboard.js"></script>
</body>

</html>
