
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Login | UniCare</title>

    <!-- Home Page CSS -->
    <link rel="stylesheet" href="CSS/style.css">

    <!-- Login Page CSS -->
    <link rel="stylesheet" href="CSS/student_login.css">

</head>

<body>

    <!-- Navbar -->
    <header class="navbar">

        <div class="logo">

            <img src="assets/images/aiub-logo.png"
                 alt="UniCare Logo">

            <span>UniCare</span>

        </div>

        <nav>
            <a href="index.html">Home</a>
            <a href="student-login.html">Student Login</a>
        </nav>

    </header>


    <!-- Login Section -->
    <section class="auth-section">

        <div class="auth-card">

            <h1>Student Login</h1>

            <p>Login to your UniCare account</p>


            <form id="loginForm" novalidate>

                <!-- Student ID -->
                <div class="form-group">

                    <label for="studentId">Student ID</label>

                    <input
                        type="text"
                        id="studentId"
                        placeholder="Enter your student ID"
                    >

                    <small id="studentIdError"></small>

                </div>


                <!-- Password -->
                <div class="form-group">

                    <label for="password">Password</label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                    >

                    <small id="passwordError"></small>

                </div>


                <!-- Submit Button -->
                <button type="submit" class="auth-btn">
                    Login
                </button>

                <p id="formMessage"></p>

            </form>


            <!-- Registration Link -->
            <p class="register-link">
                Don't have an account?
                <a href="student-register.html">Register Now</a>
            </p>


            <!-- Home Link -->
            <p class="back-link">
                <a href="index.html">Back to Home</a>
            </p>

        </div>

    </section>


    <!-- JavaScript -->
    <script src="javascript/SL_validation.js"></script>

</body>

</html>
